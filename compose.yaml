name: diet_planner

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: diet_planner-app:local
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-diet_planner}
      POSTGRES_USER: ${DB_USERNAME:-diet_planner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_password}
      TZ: Asia/Tokyo
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  node:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${VITE_FORWARD_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
    command:
      - sh
      - -lc
      - npm install && npm run dev -- --host 0.0.0.0
    networks:
      - app-network
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025"
      - "${MAILPIT_UI_FORWARD_PORT:-8025}:8025"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  node-modules: